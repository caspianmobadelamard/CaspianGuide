site_name: راهنمای کاسپین مبدل آمارد
site_description: مرجع فنی، فروش و آموزشی دیگ‌های پوسته‌ای و مخازن تحت فشار
site_author: Caspian Mobadel Amard
site_url: https://caspianmobadelamard.github.io/CaspianGuide/
repo_url: https://github.com/caspianmobadelamard/CaspianGuide
repo_name: CaspianGuide

theme:
  name: material
  language: fa
  direction: rtl
  palette:
    scheme: slate
    primary: cyan
    accent: cyan
  font:
    text: Vazirmatn
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/water-boiler
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/calculator.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3

extra:
  generator: false
  social:
    - icon: fontawesome/solid/globe
      link: https://www.caspianboiler.ir
      name: وب‌سایت کاسپین
    - icon: fontawesome/solid/phone
      link: tel:+981143115722
      name: تماس

